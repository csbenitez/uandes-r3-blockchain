name: taller-besu

x-besu-node: &besu-node
  image: ${BESU_IMAGE}
  user: root
  depends_on:
    besu-init:
      condition: service_completed_successfully
  volumes:
    - ./network/out:/net:ro
    - ./network/config.toml:/etc/besu/config.toml:ro
    - ./network/init/start.sh:/init/start.sh:ro
  restart: unless-stopped

services:
  # ---------- Generación única de genesis + llaves de los 4 validadores ----------
  besu-init:
    image: ${BESU_IMAGE}
    user: root
    entrypoint: ["/bin/bash", "/init/generate.sh"]
    environment:
      CONSENSUS: ${CONSENSUS:-qbft}
    volumes:
      - ./network:/cfg:ro
      - ./network/init/generate.sh:/init/generate.sh:ro
      - ./network/out:/out
    networks: [chain]

  # ---------- Red consorcio: 4 validadores ----------
  node1:
    <<: *besu-node
    container_name: node1
    entrypoint: ["/bin/bash", "/init/start.sh", "1"]
    ports: ["8545:8545", "8546:8546"]
    volumes:
      - node1-data:/data
      - ./network/out:/net:ro
      - ./network/config.toml:/etc/besu/config.toml:ro
      - ./network/init/start.sh:/init/start.sh:ro
    networks:
      chain: { ipv4_address: 172.16.239.11 }

  node2:
    <<: *besu-node
    container_name: node2
    entrypoint: ["/bin/bash", "/init/start.sh", "2"]
    ports: ["8555:8545", "8556:8546"]
    volumes:
      - node2-data:/data
      - ./network/out:/net:ro
      - ./network/config.toml:/etc/besu/config.toml:ro
      - ./network/init/start.sh:/init/start.sh:ro
    networks:
      chain: { ipv4_address: 172.16.239.12 }

  node3:
    <<: *besu-node
    container_name: node3
    entrypoint: ["/bin/bash", "/init/start.sh", "3"]
    ports: ["8565:8545", "8566:8546"]
    volumes:
      - node3-data:/data
      - ./network/out:/net:ro
      - ./network/config.toml:/etc/besu/config.toml:ro
      - ./network/init/start.sh:/init/start.sh:ro
    networks:
      chain: { ipv4_address: 172.16.239.13 }

  node4:
    <<: *besu-node
    container_name: node4
    entrypoint: ["/bin/bash", "/init/start.sh", "4"]
    ports: ["8575:8545", "8576:8546"]
    volumes:
      - node4-data:/data
      - ./network/out:/net:ro
      - ./network/config.toml:/etc/besu/config.toml:ro
      - ./network/init/start.sh:/init/start.sh:ro
    networks:
      chain: { ipv4_address: 172.16.239.14 }

  # ---------- Herramientas (perfil tools) ----------
  remix:
    profiles: [tools]
    image: remixproject/remix-ide:latest
    container_name: remix
    ports: ["8080:80"]
    networks: [chain]

  kms:
    profiles: [tools]
    build: { context: ./services, args: { SERVICE: kms } }
    container_name: kms
    environment:
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      KMS_DATA_DIR: /data
      CHAIN_ID: ${CHAIN_ID}
    ports: ["7070:7070"]
    volumes: [kms-data:/data]
    networks: [chain]

  indexer:
    profiles: [tools]
    build: { context: ./services, args: { SERVICE: indexer } }
    container_name: indexer
    environment:
      RPC_WS_URLS: ws://node1:8546,ws://node2:8546
      RPC_HTTP_URL: http://node1:8545
      KMS_URL: http://kms:7070
      DEPLOYMENT_FILE: /deployments/besu.json
      DB_PATH: /data/events.db
      CHAIN_ID: ${CHAIN_ID}
    ports: ["8081:8081"]
    volumes:
      - indexer-data:/data
      - ./deployments:/deployments:ro
    depends_on: [kms, node1]
    networks: [chain]

  dapp:
    profiles: [tools]
    image: nginx:1.27-alpine
    container_name: dapp
    ports: ["3000:80"]
    volumes:
      - ./dapp:/usr/share/nginx/html:ro
      - ./dapp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployments:/srv/deployments:ro
    networks: [chain]

  # ---------- Observabilidad (perfil monitoring) ----------
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [chain]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3001:3000"]
    networks: [chain]

networks:
  chain:
    ipam:
      config:
        - subnet: 172.16.239.0/24

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  kms-data:
  indexer-data:
