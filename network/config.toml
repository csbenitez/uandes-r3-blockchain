# Configuración común a los 4 nodos (la identidad y el bootnode se pasan por start.sh)
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-api=["ETH","NET","WEB3","QBFT","IBFT","CLIQUE","ADMIN","TXPOOL","DEBUG","TRACE"]
rpc-http-cors-origins=["*"]

rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-port=8546
rpc-ws-api=["ETH","NET","WEB3","QBFT","IBFT","ADMIN","TXPOOL"]

host-allowlist=["*"]
min-gas-price=0
revert-reason-enabled=true

metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545

logging="INFO"
